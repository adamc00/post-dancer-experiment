services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dancer-app:latest
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    environment:
      PLACK_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Bind-mount the current dir for local development. Remove for production to use image contents.
    volumes:
      - ./:/app:delegated
